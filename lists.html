<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists</title>
</head>
<body>
 <h1>Ordered Lists</h1>
<h2>Lists of countries</h2>

        <ol>
         <li>Kenya</li>
         <li>Uganda</li>
         <li>Tanzania</li>
         </ol>
 <h1>Unordered Lists</h1>
 <h2>Lists of fruits</h2>
    <ul>
        <li>Banana</li>
        <li>Apple</li>
        <li>Orange</li>
    </ul>


 
</body>
</html>
